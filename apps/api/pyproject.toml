[project]
name = "fornada-api"
version = "0.1.0"
description = "Fornada API: FastAPI service that runs the LangGraph ordering agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
fornada-api = "fornada_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "taskipy>=1.14.1",
]

[tool.fastapi]
entrypoint = "fornada_api.main:app"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
# Lets tests import shared helpers, e.g. `tests.unit.services.fakes`.
pythonpath = ["."]
markers = [
    "integration: needs the dev container's seeded Postgres (DATABASE_URI)",
]

# Run from apps/api: `uv run task <name>`. `dev` runs from the repo root so the
# app finds the root `.env`.
[tool.taskipy.tasks]
dev = { cmd = "fastapi dev apps/api/src/fornada_api/main.py", cwd = "../.." }
test = "pytest"
"test:unit" = "pytest tests/unit"
"test:integration" = "pytest tests/integration"
lint = "ruff check"
"lint:fix" = "ruff check --fix"
format = "ruff format"
"format:check" = "ruff format --check"
typecheck = "pyright"
check = "task lint && task format:check && task typecheck && task test"
