[project]
name = "fornada-api"
version = "0.1.0"
description = "Fornada API: FastAPI service that runs the LangGraph ordering agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
]

[project.scripts]
fornada-api = "fornada_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
