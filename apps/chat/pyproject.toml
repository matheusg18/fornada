[project]
name = "fornada-chat"
version = "0.1.0"
description = "Fornada chat: minimal Chainlit UI that talks to the API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.12.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "taskipy>=1.14.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]

# Run from apps/chat: `uv run task <name>`. `dev` serves the chat on :8001 so
# it can run next to the API on :8000.
[tool.taskipy.tasks]
dev = "chainlit run src/fornada_chat/app.py -w --headless --port 8001"
test = "pytest"
lint = "ruff check"
"lint:fix" = "ruff check --fix"
format = "ruff format"
"format:check" = "ruff format --check"
typecheck = "pyright"
check = "task lint && task format:check && task typecheck && task test"
