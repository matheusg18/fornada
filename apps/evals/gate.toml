# Gate settings for the golden suite (fornada_evals.report). A missing key reports the
# value without gating on it. Set from the v0 baseline: docs/evals/v0-baseline.md, section 9.

# Share of non-critical case runs that must pass every check, 0 to 1.
min_noncritical_rate = 0.8

# Mean US$ per conversation run (the agent's model calls only).
max_cost_per_run_usd = 0.02

# 95th percentile of turn latency across every run, in seconds (nearest rank).
max_p95_turn_latency_s = 10
