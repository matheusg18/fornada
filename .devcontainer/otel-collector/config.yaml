# EDOT Collector config for the dev environment, mounted read-only into the
# `edot-collector` service (.devcontainer/compose.yaml).
#
# Traces fan out from one OTLP receiver to two pipelines, over the compose
# network: Langfuse (the LLM view) gets every span with the content the app
# sent, infrastructure spans at DEBUG level and a turn's root named `turn`;
# Elasticsearch (Kibana APM) gets them redacted, with no
# content and the customer phone only as a salted hash. Logs go to
# Elasticsearch only (Langfuse takes traces), with the same redaction. The
# app's metrics also go to Elasticsearch only (Langfuse has no OTLP metrics
# ingestion), keeping only the allowed dimensions.
#
# Components and config keys follow EDOT 9.5.5, which is built on Collector
# core v0.161.0.

# OTLP over gRPC (4317) and HTTP (4318). The receiver listens on localhost by
# default, which other containers cannot reach, so each protocol binds to
# 0.0.0.0. No port is published to the host, so this only exposes it on the
# compose network.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# Langfuse ingests OTLP over HTTP only. `endpoint` is the base path; the
# exporter adds /v1/traces. The ingestion-version header makes spans show up
# in real time instead of up to 10 minutes later.
exporters:
  otlp_http/langfuse:
    endpoint: "http://langfuse-web:3000/api/public/otel"
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"
  # Kibana APM's data: spans as `traces-*` data streams, and the APM metrics
  # the `elasticapm` connector builds as `metrics-*`. `otel` mapping keeps the
  # OTel attribute names. Logs in as `otel_collector`, a write-only user that
  # elasticsearch-setup creates (compose.yaml).
  elasticsearch/otel:
    endpoint: http://elasticsearch:9200
    user: otel_collector
    password: ${env:ELASTIC_OTEL_PASSWORD}
    mapping:
      mode: otel

# Kibana APM needs both (EDOT docs): the processor enriches spans with the
# fields the APM UI reads, the connector turns spans into pre-aggregated APM
# metrics (latency, throughput, error rate). Both ship with EDOT only.
processors:
  elasticapm: {}

  # Redaction for Elasticsearch only (design.md, decision 5). It runs in
  # `traces/elastic`, so Langfuse still gets the content.
  transform/redact:
    # Fail closed: a statement error drops the batch for Elasticsearch
    # instead of exporting it half redacted (the default, `ignore`, would
    # log the error and send the span on with the phone in clear). Langfuse
    # is unaffected; the drop shows in this pipeline's metrics and log.
    error_mode: propagate
    trace_statements:
      # Conversation content: messages, system prompt, tool arguments and
      # results. Anchored, since the pattern matches anywhere in the key.
      - delete_matching_keys(span.attributes, "^gen_ai\\.(input\\.messages|output\\.messages|system_instructions|tool\\.call\\.(arguments|result))$")
      # Phone -> lowercase hex SHA-256 of salt + phone. The salt keeps the
      # hash from being reversed by hashing every Brazilian number, and the
      # same phone always gets the same hash, so Kibana can still group by it.
      - set(span.attributes["fornada.customer.phone"], SHA256(Concat(["${env:PHONE_HASH_SALT}", span.attributes["fornada.customer.phone"]], ""))) where IsString(span.attributes["fornada.customer.phone"])
      # The app only sends strings. Anything else is dropped, not hashed or
      # passed on (SHA256 would fail on it).
      - delete_key(span.attributes, "fornada.customer.phone") where span.attributes["fornada.customer.phone"] != nil and not IsString(span.attributes["fornada.customer.phone"])

  # Presentation for Langfuse only (langfuse-trace-readability, design.md,
  # decisions 1 and 2). It runs in `traces/langfuse`, so Elasticsearch gets
  # the spans with their names and no level attribute.
  transform/langfuse_view:
    # Fail open, unlike the redaction: a statement error only costs the view,
    # so the span goes to Langfuse unmarked instead of dropping the batch.
    error_mode: ignore
    trace_statements:
      # Infrastructure spans (HTTP, FastAPI, SQL) to Langfuse's DEBUG level,
      # which the trace tree hides by default, hanging their children on the
      # nearest visible ancestor. Kept visible: roots, GenAI operations
      # (`invoke_agent`, `chat`, `execute_tool`) and failed spans, which are
      # what an error analysis looks for.
      # A root's `parent_span_id.string` is sixteen zeros, not "": the getter
      # hex-encodes the 8-byte id (ottl ctxspan, v0.161.0). Compared as a
      # string because OTTL has no comparison rule for SpanID values.
      - set(span.attributes["langfuse.observation.level"], "DEBUG") where span.parent_span_id.string != "0000000000000000" and span.attributes["gen_ai.operation.name"] == nil and span.status.code != STATUS_CODE_ERROR
      # A turn's root (the chat's or the simulator's CLIENT span) is named
      # after the HTTP route; Langfuse lists traces by the root's name.
      - set(span.name, "turn") where span.parent_span_id.string == "0000000000000000" and span.attributes["url.template"] == "/conversations/{conversation_id}/messages"

  # Same rules as `transform/redact`, for log records. The app puts none of
  # these attributes on a log today; the statements keep the guarantee true per
  # signal, so a future `extra={"fornada.customer.phone": ...}` is hashed
  # without touching this file. Separate from `transform/redact` so each
  # pipeline's error count points at its own statements. Message bodies are
  # not touched: the app logs fixed strings and puts variable data in attributes.
  transform/redact_logs:
    error_mode: propagate
    log_statements:
      - delete_matching_keys(log.attributes, "^gen_ai\\.(input\\.messages|output\\.messages|system_instructions|tool\\.call\\.(arguments|result))$")
      - set(log.attributes["fornada.customer.phone"], SHA256(Concat(["${env:PHONE_HASH_SALT}", log.attributes["fornada.customer.phone"]], ""))) where IsString(log.attributes["fornada.customer.phone"])
      - delete_key(log.attributes, "fornada.customer.phone") where log.attributes["fornada.customer.phone"] != nil and not IsString(log.attributes["fornada.customer.phone"])

  # The app's metrics keep only their allowed dimensions (add-app-metrics,
  # design.md, decision 7). An allowlist, not a denylist like the redaction:
  # metrics have a closed set of dimensions, so any other attribute is a bug,
  # and each new value of it would be a new series in Elasticsearch.
  transform/metrics_guard:
    # Fail closed, like the redaction: a statement error drops the batch.
    error_mode: propagate
    metric_statements:
      # Data point attributes only; the resource (service.name...) is untouched.
      - keep_matching_keys(datapoint.attributes, "^(gen_ai\\.(operation\\.name|provider\\.name|request\\.model|response\\.model|agent\\.name|tool\\.name|tool\\.type)|error\\.type|fornada\\.simulator\\.persona\\.id)$")

connectors:
  elasticapm: {}

service:
  pipelines:
    traces/langfuse:
      receivers: [otlp]
      # Only the view: no batching, since the app already batches spans and
      # otlp_http queues and retries on its own.
      processors: [transform/langfuse_view]
      exporters: [otlp_http/langfuse]

    # Same receiver, second pipeline: this is the fan-out. The Collector
    # hands each pipeline whose processors change data its own copy, so
    # `transform/redact` never touches what `traces/langfuse` exports.
    traces/elastic:
      receivers: [otlp]
      # Redaction first: `elasticapm` and the connector must never see the
      # content, or it could end up in derived fields or metrics.
      processors: [transform/redact, elasticapm]
      exporters: [elasticsearch/otel, elasticapm]

    # Logs go to Elasticsearch only (Langfuse takes traces). Same receiver,
    # so the Collector hands this pipeline its own copy of each batch. No
    # `elasticapm`: EDOT exports logs verbatim, only traces need it. The
    # records keep `trace_id`/`span_id`, which is what joins a log to its trace
    # in Kibana.
    logs/elastic:
      receivers: [otlp]
      processors: [transform/redact_logs]
      exporters: [elasticsearch/otel]

    # The app's own metrics (tokens, durations, tool calls, cost,
    # conversations), delta temporality: the exporter drops cumulative
    # histograms. No `elasticapm`: it is for traces.
    metrics/elastic:
      receivers: [otlp]
      processors: [transform/metrics_guard]
      exporters: [elasticsearch/otel]

    # APM metrics the connector builds from the redacted spans (latency,
    # throughput, error rate per service and transaction), for Kibana APM.
    metrics/apm:
      receivers: [elasticapm]
      exporters: [elasticsearch/otel]

  # Internal metrics (otelcol_receiver_accepted_spans, otelcol_exporter_sent_spans,
  # and `_metric_points` for metrics) on :8888, readable from the `dev`
  # container, which has no Docker access:
  #   curl -s edot-collector:8888/metrics | grep -E 'spans|metric_points'
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
