# EDOT Collector config for the dev environment, mounted read-only into the
# `edot-collector` service (.devcontainer/compose.yaml).
#
# Traces go from OTLP to Langfuse (the LLM view), over the compose network.
# Elasticsearch, the logs and metrics pipelines and the redaction processors
# come in phase 2 step B.
#
# Components and config keys follow EDOT 9.5.5, which is built on Collector
# core v0.161.0.

# OTLP over gRPC (4317) and HTTP (4318). The receiver listens on localhost by
# default, which other containers cannot reach, so each protocol binds to
# 0.0.0.0. No port is published to the host, so this only exposes it on the
# compose network.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# Langfuse ingests OTLP over HTTP only. `endpoint` is the base path; the
# exporter adds /v1/traces. The ingestion-version header makes spans show up
# in real time instead of up to 10 minutes later.
exporters:
  otlphttp/langfuse:
    endpoint: "http://langfuse-web:3000/api/public/otel"
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"

service:
  # Traces only. Logs and metrics pipelines arrive with Elasticsearch and the
  # redaction processors, so no message text reaches a log unredacted.
  pipelines:
    traces:
      receivers: [otlp]
      # No processors: the app already batches spans and otlphttp queues and
      # retries on its own.
      exporters: [otlphttp/langfuse]

  # Internal metrics (otelcol_receiver_accepted_spans, otelcol_exporter_sent_spans)
  # on :8888, readable from the `dev` container, which has no Docker access:
  #   curl -s edot-collector:8888/metrics | grep spans
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
